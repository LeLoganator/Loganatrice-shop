<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loganatrice — Boutique rose pailleté</title>
<style>
:root{--pink:#ff2aa8;--hot:#ff55bd;--soft:#ffc5ed;--bg:#070007;--panel:#12000f;--line:#6e0d4d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#ff4fc0 1px,transparent 1.7px);background-size:38px 38px,61px 61px;opacity:.32;animation:tw 3s linear infinite}
@keyframes tw{to{background-position:38px 38px,-61px 61px}}
a{color:inherit;text-decoration:none}.top{padding:8px;text-align:center;background:#22001c;border-bottom:1px solid var(--pink);font-weight:700;font-size:13px}
header{position:sticky;top:0;z-index:20;background:rgba(7,0,7,.93);backdrop-filter:blur(18px);border-bottom:1px solid #6e0d4d}
.head{display:flex;align-items:center;gap:22px;padding:10px 3%;max-width:1500px;margin:auto}.logo{width:210px;max-height:62px;object-fit:contain}.search{flex:1;display:flex;border:1px solid var(--pink);border-radius:30px;overflow:hidden;background:#090009}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:14px 18px;font-size:15px}.search button{border:0;background:transparent;color:#ff75cf;font-size:24px;padding:0 18px;cursor:pointer}
.head-actions{display:flex;gap:15px;align-items:center}.head-actions button{border:0;background:none;color:#fff;cursor:pointer;font-size:14px}.pill{padding:9px 13px;border:1px solid var(--pink)!important;border-radius:20px}.count{background:var(--pink);padding:2px 7px;border-radius:20px}
nav{display:flex;overflow:auto;gap:5px;padding:5px 3%;border-top:1px solid #2b0023}.navbtn{min-width:max-content;background:none;color:#fff;border:0;padding:13px 18px;cursor:pointer;font-weight:700}.navbtn:hover,.navbtn.active{color:#fff;background:linear-gradient(180deg,transparent,#3d002e);box-shadow:inset 0 -3px var(--pink)}
.hero{max-width:1500px;margin:auto;padding:50px 3% 25px;display:flex;justify-content:space-between;align-items:end}.hero h1{font-size:52px;margin:5px 0;background:linear-gradient(90deg,#fff,#ff58bd,#fff);-webkit-background-clip:text;color:transparent}.hero p{color:#e8b4d8}.hero .cta{background:linear-gradient(90deg,#ff179d,#ff62c7);border:0;color:#fff;border-radius:30px;padding:14px 24px;font-weight:800;cursor:pointer}
main{max-width:1500px;margin:auto;padding:0 3% 60px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:10px 0 25px}.toolbar h2{margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{background:#14000f;color:#fff;border:1px solid #65104a;border-radius:20px;padding:9px 13px;cursor:pointer}.filter.active{background:var(--pink);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:rgba(18,0,15,.86);border:1px solid #65104a;border-radius:16px;overflow:hidden;transition:.25s;box-shadow:0 0 0 transparent}.card:hover{transform:translateY(-6px);border-color:var(--hot);box-shadow:0 15px 50px rgba(255,42,168,.18)}.card-img{position:relative;aspect-ratio:1/1;background:#090009;cursor:pointer}.card-img img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:12px;left:12px;background:var(--pink);padding:6px 10px;border-radius:8px;font-size:12px;font-weight:800}.heart{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid #ff53bb;background:#12000f;color:#fff;cursor:pointer;font-size:20px}.heart.on{background:var(--pink)}.card-body{padding:16px}.cat{color:#ff77ce;font-size:12px;text-transform:uppercase;letter-spacing:1px}.card h3{margin:7px 0;font-size:19px}.price{font-size:21px;font-weight:900}.buyrow{display:flex;gap:9px;margin-top:14px}.buyrow button{flex:1;padding:12px;border-radius:10px;cursor:pointer;border:1px solid var(--pink);background:#180010;color:#fff;font-weight:800}.buyrow .buy{background:var(--pink)}
.empty{display:none;text-align:center;padding:60px;color:#e5b4d6}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:50;padding:3%;overflow:auto}.modal.show{display:block}.product-page{max-width:1350px;margin:auto;background:#090009;border:1px solid #8c1764;border-radius:20px;box-shadow:0 0 80px rgba(255,42,168,.22);overflow:hidden}.close{position:absolute;right:25px;top:18px;background:#180010;color:#fff;border:1px solid var(--pink);border-radius:50%;width:44px;height:44px;font-size:25px;cursor:pointer;z-index:2}
.pwrap{display:grid;grid-template-columns:1.25fr .9fr;gap:25px;padding:25px}.gallery{display:grid;grid-template-columns:90px 1fr;gap:15px}.thumbs{display:flex;flex-direction:column;gap:10px}.thumb{border:1px solid #66104b;border-radius:10px;overflow:hidden;cursor:pointer;background:#10000d}.thumb.active{border-color:var(--pink);box-shadow:0 0 18px rgba(255,42,168,.35)}.thumb img{width:100%;display:block}.mainimg{position:relative;border:1px solid #66104b;border-radius:15px;overflow:hidden;background:#090009}.mainimg img{width:100%;display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:1px solid var(--pink);background:#10000dcc;color:#fff;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:24px}.arrow.l{left:12px}.arrow.r{right:12px}.zoom{position:absolute;right:15px;bottom:15px;border:1px solid var(--pink);background:#10000dcc;color:#fff;width:42px;height:42px;border-radius:50%;cursor:pointer}
.info{padding:5px}.tag{display:inline-block;background:var(--pink);padding:7px 11px;border-radius:8px;font-size:12px;font-weight:800}.info h2{font-size:36px;margin:12px 0 8px}.stars{color:#ff6ac7}.desc{color:#e6c0da;line-height:1.6}.detail-line{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.size{padding:10px 14px;background:#14000f;border:1px solid #6e0d4d;color:#fff;border-radius:8px;cursor:pointer}.size.sel{background:var(--pink);border-color:var(--pink)}.qty{display:flex;align-items:center;gap:10px}.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--pink);background:#180010;color:#fff;font-size:20px;cursor:pointer}.add{width:100%;margin-top:18px;padding:16px;border:0;border-radius:10px;background:linear-gradient(90deg,#ff179d,#ff63c7);color:#fff;font-size:18px;font-weight:900;cursor:pointer}.favorite{width:100%;margin-top:10px;padding:12px;border:1px solid var(--pink);border-radius:10px;background:#12000f;color:#fff;cursor:pointer}.info-box{margin-top:20px;border-top:1px solid #55103f;padding-top:15px}.suggestions{border-top:1px solid #55103f;padding:25px}.suggestions h3{margin-top:0}.mini-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.mini{border:1px solid #55103f;border-radius:10px;overflow:hidden;cursor:pointer;background:#10000d}.mini img{width:100%;display:block}.mini div{padding:8px;font-size:12px}.toast{position:fixed;right:22px;bottom:22px;background:#ff2aa8;color:#fff;padding:14px 18px;border-radius:12px;z-index:100;display:none;box-shadow:0 10px 35px rgba(255,42,168,.3)}.toast.show{display:block}
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:min(430px,95vw);background:#0b0009;border-left:1px solid var(--pink);z-index:70;transform:translateX(100%);transition:.25s;padding:22px;overflow:auto}.cart-panel.show{transform:translateX(0)}.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #431032}.cart-item img{width:70px;height:70px;object-fit:cover;border-radius:8px}.cart-total{font-size:24px;font-weight:900;margin:20px 0}.checkout{width:100%;padding:14px;background:var(--pink);border:0;border-radius:10px;color:#fff;font-weight:900;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.pwrap{grid-template-columns:1fr}.head{flex-wrap:wrap}.logo{width:170px}.search{order:3;flex-basis:100%}.mini-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:38px}.gallery{grid-template-columns:65px 1fr}.info h2{font-size:28px}.mini-grid{grid-template-columns:repeat(2,1fr)}}

.account-modal{align-items:center;justify-content:center;z-index:1000!important;background:rgba(0,0,0,.88)}
.account-modal.show{display:flex!important}
.account-panel{position:relative;width:min(560px,94vw);background:linear-gradient(145deg,#10000d,#080008);border:1px solid #ff39b8;border-radius:22px;box-shadow:0 0 70px rgba(255,40,180,.28);padding:2px;overflow:hidden}
.account-panel:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,rgba(255,64,190,.16),transparent 38%),radial-gradient(circle at 100% 100%,rgba(255,0,128,.1),transparent 42%);pointer-events:none}
.account-inner{position:relative;padding:34px 30px 30px}
.account-inner h2{margin:10px 0 22px;font-size:28px}
.account-inner .field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.account-inner .field label{font-size:13px;font-weight:800;color:#ffd9f2}
.account-inner .field input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #7e185f;border-radius:11px;background:#090007;color:#fff;font:inherit;outline:none}
.account-inner .field input:focus{border-color:#ff45bf;box-shadow:0 0 0 3px rgba(255,69,191,.12)}
.account-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.account-actions button{font:inherit}
.account-note{margin-top:14px;padding:12px 14px;border:1px solid rgba(255,69,191,.28);border-radius:12px;background:rgba(255,40,180,.07);color:#ffd9f2;font-size:13px;line-height:1.5}
.account-modal .close{position:absolute;right:16px;top:14px}
</style>

</head>
<body>
<div class="top">✨ LOGANATRICE — TOUT EN ROSE PAILLETÉ ✨</div>
<header>
 <div class="head">
  <img class="logo" src="logo-L-paillete-rose.png" alt="Logo Loganatrice">
  <div class="search"><input id="search" placeholder="Rechercher un produit..."><button onclick="doSearch()">⌕</button></div>
  <div class="head-actions"><button id="accountBtn" type="button">♙ Compte</button><button onclick="showFavorites()">♡ Favoris</button><button class="pill" onclick="toggleCart()">🛒 Panier <span class="count" id="cartCount">0</span></button></div>
 </div>
 <nav id="nav"></nav>
</header>
<section class="hero"><div><div style="color:#ff77ce;letter-spacing:3px">— COLLECTION —</div><h1>LOGANATRICE</h1><p>Le même esprit de présentation premium, en rose pailleté. 💗✨</p><button class="cta" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Découvrir la boutique →</button></div></section>
<main>
 <div class="toolbar"><h2 id="sectionTitle">Tous les produits</h2><div class="filters" id="filters"></div></div>
 <div class="grid" id="products"></div><div class="empty" id="empty">Aucun produit trouvé.</div>
</main>

<div class="modal" id="modal"><button class="close" onclick="closeProduct()">×</button><div class="product-page" id="productPage"></div></div>
<div class="modal account-modal" id="accountModal" onclick="if(event.target===this)closeAccount()">
 <div class="account-panel">
  <button class="close" type="button" onclick="closeAccount()">×</button>
  <div class="account-inner">
   <span class="tag">LOGANATRICE</span>
   <h2 id="authTitle">Connexion / création de compte</h2>
   <div id="accountArea"></div>
  </div>
 </div>
</div>
<aside class="cart-panel" id="cartPanel"><button class="close" style="position:static;float:right" onclick="toggleCart()">×</button><h2>🛒 Ton panier</h2><div id="cartItems"></div><div class="cart-total" id="cartTotal">Total : 0,00 €</div><button class="checkout" onclick="checkout()">Passer la commande</button></aside>
<div class="toast" id="toast"></div>

<script>
const PRODUCTS = [{"id": "talons", "name": "Talons Loganatrice", "price": "79,99 €", "sizes": ["35", "36", "37", "38", "39", "40", "41"], "desc": "Talons rose pailleté avec logo Loganatrice.", "cat": "Talons", "images": ["talons.png"]}, {"id": "robe-courte", "name": "Robe courte Loganatrice", "price": "59,99 €", "sizes": ["XS", "S", "M", "L", "XL"], "desc": "Robe courte entièrement rose pailleté, sans logo.", "cat": "Robes", "images": ["robe-courte.png"]}, {"id": "robe-longue", "name": "Robe longue Loganatrice", "price": "89,99 €", "sizes": ["XS", "S", "M", "L", "XL"], "desc": "Robe longue rose pailleté, coupe élégante, sans logo.", "cat": "Robes", "images": ["robe-longue.png"]}, {"id": "jupe", "name": "Jupe Loganatrice", "price": "49,99 €", "sizes": ["XS", "S", "M", "L", "XL"], "desc": "Jupe rose pailleté assortie à la collection.", "cat": "Jupes", "images": ["jupe.png"]}, {"id": "casquette", "name": "Casquette Loganatrice", "price": "24,99 €", "sizes": ["Unique"], "desc": "Casquette rose pailleté avec logo de la boutique.", "cat": "Casquettes", "images": ["casquette.png"]}, {"id": "casque-bluetooth", "name": "Casque Bluetooth Loganatrice", "price": "89,99 €", "sizes": ["Unique"], "desc": "Casque Bluetooth rose pailleté avec logo Loganatrice.", "cat": "Casques", "images": ["casque-bluetooth.png"]}, {"id": "sac", "name": "Sac Loganatrice", "price": "54,99 €", "sizes": ["Unique"], "desc": "Sac rose pailleté avec logo Loganatrice.", "cat": "Sacs", "images": ["sac.png"]}, {"id": "accessoires", "name": "Set d'accessoires Loganatrice", "price": "29,99 €", "sizes": ["Unique"], "desc": "Set d'accessoires rose pailleté.", "cat": "Accessoires", "images": ["accessoires.png"]}, {"id": "doudoune", "name": "Doudoune Loganatrice", "price": "99,99 €", "sizes": ["XS", "S", "M", "L", "XL"], "desc": "Doudoune rose pailleté avec logo Loganatrice.", "cat": "Doudounes", "images": ["doudoune.png"]}];
let cats=["Tous",...new Set(PRODUCTS.map(p=>p.cat))];
let currentCat="Tous", currentProduct=null, currentImage=0, currentSize=null, qty=1;
let cart=JSON.parse(localStorage.getItem("loganatrice_cart")||"[]");
let favs=JSON.parse(localStorage.getItem("loganatrice_favs")||"[]");

function euro(s){return s}
function save(){localStorage.setItem("loganatrice_cart",JSON.stringify(cart));localStorage.setItem("loganatrice_favs",JSON.stringify(favs));updateCartCount()}
function updateCartCount(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)}
function setup(){
 document.getElementById("nav").innerHTML=cats.map(c=>`<button class="navbtn ${c==="Tous"?"active":""}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("");
 document.getElementById("filters").innerHTML=cats.map(c=>`<button class="filter ${c==="Tous"?"active":""}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join("");
 document.getElementById("search").addEventListener("input",render);
 render();updateCartCount();
}
function setCat(c){currentCat=c;document.querySelectorAll(".navbtn,.filter").forEach(b=>b.classList.toggle("active",b.textContent===c));document.getElementById("sectionTitle").textContent=c==="Tous"?"Tous les produits":c;render();window.scrollTo({top:document.querySelector("main").offsetTop-90,behavior:"smooth"})}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=PRODUCTS.filter(p=>(currentCat==="Tous"||p.cat===currentCat)&&(p.name+" "+p.cat+" "+p.desc).toLowerCase().includes(q));
 const box=document.getElementById("products"),empty=document.getElementById("empty");
 box.innerHTML=list.map(p=>`<article class="card">
   <div class="card-img" onclick="openProduct('${p.id}')"><span class="badge">NOUVEAU</span><button class="heart ${favs.includes(p.id)?"on":""}" onclick="event.stopPropagation();toggleFav('${p.id}')">♡</button><img src="${p.images[0]}" alt="${p.name}"></div>
   <div class="card-body"><div class="cat">${p.cat}</div><h3>${p.name}</h3><div class="price">${p.price}</div><div class="buyrow"><button onclick="openProduct('${p.id}')">Voir le produit</button><button class="buy" onclick="quickAdd('${p.id}')">🛒 Ajouter</button></div></div>
 </article>`).join("");
 empty.style.display=list.length?"none":"block";
}
function toggleFav(id){favs.includes(id)?favs=favs.filter(x=>x!==id):favs.push(id);save();render();toast(favs.includes(id)?"💗 Ajouté aux favoris":"Retiré des favoris")}
function showFavorites(){const old=currentCat;currentCat="Tous";document.getElementById("search").value="";render();toast("♡ Tes favoris sont enregistrés dans ce navigateur.");}
function openProduct(id){
 currentProduct=PRODUCTS.find(p=>p.id===id);currentImage=0;currentSize=currentProduct.sizes[0];qty=1;renderProduct();document.getElementById("modal").classList.add("show");document.body.style.overflow="hidden";
}
function closeProduct(){document.getElementById("modal").classList.remove("show");document.body.style.overflow=""}
function renderProduct(){
 const p=currentProduct, im=p.images[currentImage];
 document.getElementById("productPage").innerHTML=`<div class="pwrap">
  <div class="gallery">${p.images.length>1?`<div class="thumbs">${p.images.map((x,i)=>`<div class="thumb ${i===currentImage?"active":""}" onclick="setImage(${i})"><img src="${x}"></div>`).join("")}</div>`:""}
  <div class="mainimg"><img src="${im}" alt="${p.name}">${p.images.length>1?`<button class="arrow l" onclick="prevImg()">‹</button><button class="arrow r" onclick="nextImg()">›</button>`:""}<button class="zoom" onclick="zoomImage()">⌕</button></div></div>
  <div class="info"><span class="tag">NOUVEAU</span><h2>${p.name} 👑</h2><div class="stars">★★★★★ <span style="color:#fff">4,9/5 (124 avis)</span></div><div class="price" style="font-size:32px;margin:15px 0">${p.price}</div>
  <p class="desc">${p.desc}</p><div class="info-box"><b>✨ Détails</b><p>Rose pailleté • Logo Loganatrice • Collection premium • Livraison 3 à 5 jours</p></div>
  <b>Taille :</b><div class="detail-line">${p.sizes.map(s=>`<button class="size ${s===currentSize?"sel":""}" onclick="chooseSize('${s}')">${s}</button>`).join("")}</div>
  <b>Quantité :</b><div class="qty"><button onclick="changeQty(-1)">−</button><span id="qtyVal">${qty}</span><button onclick="changeQty(1)">+</button></div>
  <button class="add" onclick="addToCart('${p.id}')">🛍️ Ajouter au panier</button><button class="favorite" onclick="toggleFav('${p.id}')">♡ Ajouter aux favoris</button>
  <div class="info-box">🚚 Livraison rapide et suivie<br><br>↩️ Retours sous 14 jours<br><br>🔒 Paiement sécurisé</div></div></div>
  <div class="suggestions"><h3>Vous aimerez aussi ✨</h3><div class="mini-grid">${PRODUCTS.filter(x=>x.id!==p.id).slice(0,5).map(x=>`<div class="mini" onclick="openProduct('${x.id}')"><img src="${x.images[0]}"><div>${x.name}<br><b>${x.price}</b></div></div>`).join("")}</div></div>`;
}
function setImage(i){currentImage=i;renderProduct()}function prevImg(){currentImage=(currentImage+currentProduct.images.length-1)%currentProduct.images.length;renderProduct()}function nextImg(){currentImage=(currentImage+1)%currentProduct.images.length;renderProduct()}
function zoomImage(){let w=window.open();w.document.write(`<title>${currentProduct.name}</title><style>body{margin:0;background:#000}img{width:100%;height:100vh;object-fit:contain}</style><img src="${currentProduct.images[currentImage]}">`)}
function chooseSize(s){currentSize=s;renderProduct()}function changeQty(n){qty=Math.max(1,qty+n);renderProduct()}
function addToCart(id){const p=PRODUCTS.find(x=>x.id===id);const key=id+"|"+currentSize;let item=cart.find(x=>x.key===key);if(item)item.qty+=qty;else cart.push({key,id,size:currentSize,qty,name:p.name,price:p.price,img:p.images[0]});save();toast("🛒 Produit ajouté au panier");}
function quickAdd(id){currentProduct=PRODUCTS.find(x=>x.id===id);currentSize=currentProduct.sizes[0];qty=1;addToCart(id)}
function toggleCart(){document.getElementById("cartPanel").classList.toggle("show");renderCart()}
function renderCart(){let box=document.getElementById("cartItems");if(!cart.length){box.innerHTML="<p>Ton panier est vide.</p>";document.getElementById("cartTotal").textContent="Total : 0,00 €";return}box.innerHTML=cart.map((x,i)=>`<div class="cart-item"><img src="${x.img}"><div style="flex:1"><b>${x.name}</b><br>Taille : ${x.size}<br>${x.price} × ${x.qty}<br><button class="filter" onclick="removeCart(${i})">Supprimer</button></div></div>`).join("");let total=cart.reduce((a,x)=>a+parseFloat(x.price.replace("€","").replace(",", "."))*x.qty,0);document.getElementById("cartTotal").textContent="Total : "+total.toFixed(2).replace(".",",")+" €"}
function removeCart(i){cart.splice(i,1);save();renderCart()}function checkout(){if(!cart.length)return toast("Ton panier est vide");toast("✅ Commande simulée — paiement à connecter");}
setup();
</script>

  async function login(){
    const email=el('accountEmail')?.value.trim().toLowerCase(),password=el('accountPassword')?.value||'';

    const sb=ensureClient();if(!sb)return msg('Connexion indisponible.');

  async function signup(){

})();
</script>

function publishedStore(row){
  const d=(row?.published&&typeof row.published==='object')?row.published:row?.draft;

function normalize(p){
  const price=Number(p.price)||0;
  return {
    id:String(p.id),name:p.name||'Produit Loganatrice',price:price.toFixed(2).replace('.',',')+' €',
    sizes:Array.isArray(p.sizes)&&p.sizes.length?p.sizes:['Unique'],
    desc:p.description||((p.details||[]).join('\n'))||'',cat:p.cat||p.category||'Produits',
    images:Array.isArray(p.images)&&p.images.length?p.images:[p.image||p.image_url].filter(Boolean)
  };
}
async function loadCloudStore(){
  const c=client();if(!c)return;
  try{
    const r=await c.from('store_settings').select('draft,published').eq('id',1).maybeSingle();
    if(r.error||!r.data)return;
